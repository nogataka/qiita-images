  <text x="600" y="300" font-family="'Hiragino Kaku Gothic ProN','Hiragino Sans',sans-serif" font-size="34" fill="#52555B" text-anchor="middle" font-weight="normal">→</text>
  <text x="600" y="336" font-family="'Hiragino Kaku Gothic ProN','Hiragino Sans',sans-serif" font-size="14" fill="#52555B" text-anchor="middle" font-weight="normal">ドリフト</text>
  <rect x="100" y="552" width="1000" height="150" rx="12" ry="12" fill="#FFFFFF" stroke="#CDD6DE" stroke-width="2"/>
  <text x="124" y="584" font-family="'Hiragino Kaku Gothic ProN W6','Hiragino Sans W6',sans-serif" font-size="15" fill="#232A34" text-anchor="start" font-weight="normal">積み重なった局所判断（それぞれには理由がある）</text>
  <text x="124" y="614" font-family="'Hiragino Kaku Gothic ProN','Hiragino Sans',sans-serif" font-size="13.5" fill="#3E4148" text-anchor="start" font-weight="normal">・この画面はイベント処理が必要 → Client Component にする</text>
  <text x="124" y="640" font-family="'Hiragino Kaku Gothic ProN','Hiragino Sans',sans-serif" font-size="13.5" fill="#3E4148" text-anchor="start" font-weight="normal">・既存の fetch ベースの実装に合わせたい → Route Handler を追加する</text>
  <text x="124" y="666" font-family="'Hiragino Kaku Gothic ProN','Hiragino Sans',sans-serif" font-size="13.5" fill="#3E4148" text-anchor="start" font-weight="normal">・Route Handler からデータを更新したい → ここで直接 ORM を呼べば早い</text>
  <text x="30" y="770" font-family="'Hiragino Kaku Gothic ProN','Hiragino Sans',sans-serif" font-size="13" fill="#52555B" text-anchor="start" font-weight="normal">問題は変更されたことではなく、変更されたと人間が気づかないまま進むこと。</text>
