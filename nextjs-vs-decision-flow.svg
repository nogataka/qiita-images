<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="790" viewBox="0 0 1200 790">
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#2163A7"/>
    </marker>
    <marker id="arR" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#B4472F"/>
    </marker>
  </defs>
  <rect width="1200" height="790" fill="#FFFFFF"/>
  <text x="30" y="46" font-family="'Hiragino Kaku Gothic ProN W6','Hiragino Sans W6',sans-serif" font-size="25" fill="#232A34" text-anchor="start" font-weight="normal">Server Actions と Route Handler の選定フロー</text>
  <line x1="30" y1="64" x2="1170" y2="64" stroke="#ECECEC" stroke-width="2" stroke-linecap="round"/>
  <rect x="36" y="100" width="500" height="156" rx="12" ry="12" fill="#F8FAFC" stroke="#2163A7" stroke-width="2.5"/>
  <text x="68" y="152" font-family="'Hiragino Kaku Gothic ProN W6','Hiragino Sans W6',sans-serif" font-size="21" fill="#232A34" text-anchor="start" font-weight="normal">サーバー状態を更新するか？</text>
  <text x="68" y="192" font-family="'Hiragino Kaku Gothic ProN','Hiragino Sans',sans-serif" font-size="15" fill="#3E4148" text-anchor="start" font-weight="normal">読み取りだけか、書き込みが伴うかを</text>
  <text x="68" y="218" font-family="'Hiragino Kaku Gothic ProN','Hiragino Sans',sans-serif" font-size="15" fill="#3E4148" text-anchor="start" font-weight="normal">最初に分ける</text>
  <rect x="654" y="104" width="510" height="148" rx="12" ry="12" fill="#F8FCFF" stroke="#90B9DA" stroke-width="2.5"/>
  <text x="686" y="152" font-family="'Hiragino Kaku Gothic ProN W6','Hiragino Sans W6',sans-serif" font-size="20" fill="#232A34" text-anchor="start" font-weight="normal">いいえ → 取得の経路を選ぶ</text>
  <text x="686" y="192" font-family="'Hiragino Kaku Gothic ProN','Hiragino Sans',sans-serif" font-size="15" fill="#3E4148" text-anchor="start" font-weight="normal">Server Component から取得できる</text>
  <text x="686" y="218" font-family="'Hiragino Kaku Gothic ProN','Hiragino Sans',sans-serif" font-size="15" fill="#3E4148" text-anchor="start" font-weight="normal">　→ Service / DB を直接呼ぶ</text>
  <text x="686" y="244" font-family="'Hiragino Kaku Gothic ProN','Hiragino Sans',sans-serif" font-size="15" fill="#3E4148" text-anchor="start" font-weight="normal">ブラウザから動的に取得する → Route Handler</text>
  <line x1="536" y1="178.0" x2="654" y2="178.0" stroke="#2163A7" stroke-width="3" marker-end="url(#ar)"/>
  <text x="600" y="164.0" font-family="'Hiragino Kaku Gothic ProN W6','Hiragino Sans W6',sans-serif" font-size="16" fill="#2163A7" text-anchor="middle" font-weight="normal">いいえ</text>
  <line x1="286.0" y1="256" x2="286.0" y2="326" stroke="#2163A7" stroke-width="3" marker-end="url(#ar)"/>
  <text x="302.0" y="298" font-family="'Hiragino Kaku Gothic ProN W6','Hiragino Sans W6',sans-serif" font-size="16" fill="#2163A7" text-anchor="start" font-weight="normal">はい</text>
  <rect x="36" y="326" width="500" height="156" rx="12" ry="12" fill="#F8FAFC" stroke="#2163A7" stroke-width="2.5"/>
  <text x="68" y="378" font-family="'Hiragino Kaku Gothic ProN W6','Hiragino Sans W6',sans-serif" font-size="21" fill="#232A34" text-anchor="start" font-weight="normal">Next.js の画面以外から呼ばれるか？</text>
  <text x="68" y="418" font-family="'Hiragino Kaku Gothic ProN','Hiragino Sans',sans-serif" font-size="15" fill="#3E4148" text-anchor="start" font-weight="normal">モバイルアプリ・外部SaaS・Webhook・</text>
  <text x="68" y="444" font-family="'Hiragino Kaku Gothic ProN','Hiragino Sans',sans-serif" font-size="15" fill="#3E4148" text-anchor="start" font-weight="normal">パートナー向け API の予定があるか</text>
  <rect x="654" y="330" width="510" height="148" rx="12" ry="12" fill="#F8FCFF" stroke="#90B9DA" stroke-width="2.5"/>
  <text x="686" y="378" font-family="'Hiragino Kaku Gothic ProN W6','Hiragino Sans W6',sans-serif" font-size="20" fill="#232A34" text-anchor="start" font-weight="normal">はい → Route Handler</text>
  <text x="686" y="418" font-family="'Hiragino Kaku Gothic ProN','Hiragino Sans',sans-serif" font-size="15" fill="#3E4148" text-anchor="start" font-weight="normal">URL・メソッド・ステータスを契約にする</text>
  <text x="686" y="444" font-family="'Hiragino Kaku Gothic ProN','Hiragino Sans',sans-serif" font-size="15" fill="#3E4148" text-anchor="start" font-weight="normal">例: 公開 API / Webhook / OAuth</text>
  <line x1="536" y1="404.0" x2="654" y2="404.0" stroke="#2163A7" stroke-width="3" marker-end="url(#ar)"/>
  <text x="606" y="390.0" font-family="'Hiragino Kaku Gothic ProN W6','Hiragino Sans W6',sans-serif" font-size="16" fill="#2163A7" text-anchor="middle" font-weight="normal">はい</text>
  <line x1="286.0" y1="482" x2="286.0" y2="552" stroke="#2163A7" stroke-width="3" marker-end="url(#ar)"/>
  <text x="302.0" y="524" font-family="'Hiragino Kaku Gothic ProN W6','Hiragino Sans W6',sans-serif" font-size="16" fill="#2163A7" text-anchor="start" font-weight="normal">いいえ</text>
  <rect x="36" y="552" width="500" height="156" rx="12" ry="12" fill="#F8FAFC" stroke="#2163A7" stroke-width="2.5"/>
  <text x="68" y="604" font-family="'Hiragino Kaku Gothic ProN W6','Hiragino Sans W6',sans-serif" font-size="21" fill="#232A34" text-anchor="start" font-weight="normal">HTTP を直接制御する必要があるか？</text>
  <text x="68" y="644" font-family="'Hiragino Kaku Gothic ProN','Hiragino Sans',sans-serif" font-size="15" fill="#3E4148" text-anchor="start" font-weight="normal">Webhook・ファイル配信・SSE・CORS 制御が</text>
  <text x="68" y="670" font-family="'Hiragino Kaku Gothic ProN','Hiragino Sans',sans-serif" font-size="15" fill="#3E4148" text-anchor="start" font-weight="normal">要るなら、更新処理でも例外扱いにする</text>
  <rect x="654" y="556" width="510" height="148" rx="12" ry="12" fill="#F8FCFF" stroke="#90B9DA" stroke-width="2.5"/>
  <text x="686" y="604" font-family="'Hiragino Kaku Gothic ProN W6','Hiragino Sans W6',sans-serif" font-size="20" fill="#232A34" text-anchor="start" font-weight="normal">いいえ → Server Action</text>
  <text x="686" y="644" font-family="'Hiragino Kaku Gothic ProN','Hiragino Sans',sans-serif" font-size="15" fill="#3E4148" text-anchor="start" font-weight="normal">Next.js 画面専用の登録・更新・削除</text>
  <text x="686" y="670" font-family="'Hiragino Kaku Gothic ProN','Hiragino Sans',sans-serif" font-size="15" fill="#3E4148" text-anchor="start" font-weight="normal">更新後の再検証まで React に統合できる</text>
  <line x1="536" y1="630.0" x2="654" y2="630.0" stroke="#2163A7" stroke-width="3" marker-end="url(#ar)"/>
  <text x="600" y="616.0" font-family="'Hiragino Kaku Gothic ProN W6','Hiragino Sans W6',sans-serif" font-size="16" fill="#2163A7" text-anchor="middle" font-weight="normal">いいえ</text>
  <text x="36" y="752" font-family="'Hiragino Kaku Gothic ProN','Hiragino Sans',sans-serif" font-size="13" fill="#52555B" text-anchor="start" font-weight="normal">分岐は2つだけ。サーバー状態を更新するか、Next.js の画面以外から呼ばれるか。3段目は更新処理でも Route Handler を選ぶ例外</text>
</svg>
