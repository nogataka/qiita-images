  <line x1="927" y1="427.0" x2="936" y2="427.0" stroke="#2163A7" stroke-width="2.2" marker-end="url(#ar)"/>
  <rect x="942" y="398" width="152" height="58" rx="12" ry="12" fill="#F8FCFF" stroke="#90B9DA" stroke-width="2.5"/>
  <text x="1018.0" y="434" font-family="'SF Mono','Menlo','Courier New',monospace" font-size="15" fill="#232A34" text-anchor="middle" font-weight="normal">review</text>
  <text x="92" y="498" font-family="'Hiragino Kaku Gothic ProN','Hiragino Sans',sans-serif" font-size="13.5" fill="#3E4148" text-anchor="start" font-weight="normal">各機能の spec は、プロジェクト層の全体設計書を前提にする。</text>
  <text x="92" y="522" font-family="'Hiragino Kaku Gothic ProN','Hiragino Sans',sans-serif" font-size="13.5" fill="#B4472F" text-anchor="start" font-weight="normal">実装中に前提そのものを変える必要が出たら、Change Request でプロジェクト層へ戻す。</text>
  <line x1="600" y1="296" x2="600" y2="336" stroke="#2163A7" stroke-width="2.4" marker-end="url(#ar)"/>
  <text x="618" y="323.0" font-family="'Hiragino Kaku Gothic ProN','Hiragino Sans',sans-serif" font-size="13.5" fill="#2163A7" text-anchor="start" font-weight="normal">承認済み Baseline を機能層の入力にする</text>
  <polyline points="1140,492 1170,492 1170,196 1148,196" fill="none" stroke="#B4472F" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arR)"/>
  <text x="30" y="640" font-family="'Hiragino Kaku Gothic ProN','Hiragino Sans',sans-serif" font-size="13" fill="#52555B" text-anchor="start" font-weight="normal">全体設計書を「事前に用意しておくもの」ではなく、SDDの最初のフェーズの成果物として扱う。</text>
