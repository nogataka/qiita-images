  <line x1="556" y1="181.0" x2="570" y2="181.0" stroke="#2163A7" stroke-width="2.2" marker-end="url(#ar)"/>
  <rect x="576" y="152" width="218" height="58" rx="12" ry="12" fill="#F8FAFC" stroke="#2163A7" stroke-width="2.5"/>
