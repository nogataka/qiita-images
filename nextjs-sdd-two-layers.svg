  <text x="1116" y="126" font-family="'SF Mono','Menlo','Courier New',monospace" font-size="14" fill="#52555B" text-anchor="end" font-weight="normal">docs/</text>
  <rect x="92" y="152" width="218" height="58" rx="12" ry="12" fill="#F8FAFC" stroke="#2163A7" stroke-width="2.5"/>
