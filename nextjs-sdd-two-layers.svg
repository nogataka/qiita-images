  <text x="508.0" y="434" font-family="'SF Mono','Menlo','Courier New',monospace" font-size="15" fill="#232A34" text-anchor="middle" font-weight="normal">tasks</text>
  <line x1="587" y1="427.0" x2="596" y2="427.0" stroke="#2163A7" stroke-width="2.2" marker-end="url(#ar)"/>
  <rect x="602" y="398" width="152" height="58" rx="12" ry="12" fill="#F8FAFC" stroke="#2163A7" stroke-width="2.5"/>
