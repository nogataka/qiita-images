  <rect x="400" y="234" width="400" height="44" rx="8" ry="8" fill="#F8FCFF" stroke="#90B9DA" stroke-width="2"/>
  <text x="600" y="263" font-family="'Hiragino Kaku Gothic ProN W6','Hiragino Sans W6',sans-serif" font-size="14" fill="#2163A7" text-anchor="middle" font-weight="normal">Project Baseline Gate（人間が承認）</text>
  <line x1="600" y1="212" x2="600" y2="230" stroke="#2163A7" stroke-width="2.2" marker-end="url(#ar)"/>
  <rect x="60" y="340" width="1080" height="210" rx="12" ry="12" fill="#FFFFFF" stroke="#90B9DA" stroke-width="2.5"/>
  <text x="84" y="370" font-family="'Hiragino Kaku Gothic ProN W6','Hiragino Sans W6',sans-serif" font-size="16.5" fill="#2163A7" text-anchor="start" font-weight="normal">機能層（機能ごとに繰り返す）</text>
  <text x="1116" y="370" font-family="'SF Mono','Menlo','Courier New',monospace" font-size="14" fill="#52555B" text-anchor="end" font-weight="normal">specs/&lt;feature-id&gt;/</text>
