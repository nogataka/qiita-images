  <text x="662" y="308" font-family="'Hiragino Kaku Gothic ProN','Hiragino Sans','BIZ UDGothic',sans-serif" font-size="16" fill="#F7F5EF" text-anchor="middle" font-weight="600">8</text>
  <text x="702" y="307" font-family="'Hiragino Kaku Gothic ProN','Hiragino Sans','BIZ UDGothic',sans-serif" font-size="14" fill="#16241F" text-anchor="start" font-weight="normal">Client Components を Hydration して操作可能にする</text>
  <polyline points="82,324 82,346 640,346 640,92" fill="none" stroke="#C6CEC6" stroke-width="1.2" marker-end="url(#ar)"/>
  <text x="28" y="414" font-family="'Hiragino Kaku Gothic ProN','Hiragino Sans','BIZ UDGothic',sans-serif" font-size="12" fill="#5D6B64" text-anchor="start" font-weight="normal">左列の4ステップが終わってから右列へ進む。Server Component の実装コードはブラウザへ送られない</text>
