  <rect width="1200" height="432" fill="#F7F5EF"/>
  <text x="28" y="40" font-family="'Hiragino Kaku Gothic ProN','Hiragino Sans','BIZ UDGothic',sans-serif" font-size="20" fill="#0F4332" text-anchor="start" font-weight="600">初回アクセスで何が起きるか（RSC → HTML → Hydration）</text>
