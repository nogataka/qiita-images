  <text x="662" y="246" font-family="'Hiragino Kaku Gothic ProN','Hiragino Sans','BIZ UDGothic',sans-serif" font-size="16" fill="#F7F5EF" text-anchor="middle" font-weight="600">7</text>
  <text x="702" y="245" font-family="'Hiragino Kaku Gothic ProN','Hiragino Sans','BIZ UDGothic',sans-serif" font-size="14" fill="#16241F" text-anchor="start" font-weight="normal">Client Component 用 JavaScript を読み込む</text>
  <line x1="662" y1="262" x2="662" y2="278" stroke="#0F4332" stroke-width="1.5" marker-end="url(#ar)"/>
  <rect x="640" y="278" width="520" height="46" fill="#EFEBE1" stroke="#C6CEC6" stroke-width="1"/>
