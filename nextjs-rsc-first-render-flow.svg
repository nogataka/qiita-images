  <text x="122" y="121" font-family="'Hiragino Kaku Gothic ProN','Hiragino Sans','BIZ UDGothic',sans-serif" font-size="14" fill="#16241F" text-anchor="start" font-weight="normal">ブラウザがページを要求する</text>
