<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="432" viewBox="0 0 1200 432">
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#2163A7"/>
    </marker>
    <marker id="arR" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#B4472F"/>
    </marker>
  </defs>
  <rect width="1200" height="432" fill="#FFFFFF"/>
  <text x="30" y="46" font-family="'Hiragino Kaku Gothic ProN W6','Hiragino Sans W6',sans-serif" font-size="25" fill="#232A34" text-anchor="start" font-weight="normal">初回アクセスで何が起きるか（RSC → HTML → Hydration）</text>
  <line x1="30" y1="64" x2="1170" y2="64" stroke="#ECECEC" stroke-width="2" stroke-linecap="round"/>
  <rect x="60" y="92" width="520" height="46" rx="12" ry="12" fill="#F8FAFC" stroke="#90B9DA" stroke-width="2"/>
  <rect x="60" y="92" width="46" height="46" rx="10" ry="10" fill="#2163A7" stroke="none"/>
  <text x="83" y="123" font-family="'Hiragino Kaku Gothic ProN W6','Hiragino Sans W6',sans-serif" font-size="16" fill="#FFFFFF" text-anchor="middle" font-weight="normal">1</text>
  <text x="128" y="122" font-family="'Hiragino Kaku Gothic ProN','Hiragino Sans',sans-serif" font-size="15" fill="#3E4148" text-anchor="start" font-weight="normal">ブラウザがページを要求する</text>
  <rect x="60" y="154" width="520" height="46" rx="12" ry="12" fill="#F8FCFF" stroke="#90B9DA" stroke-width="2"/>
  <rect x="60" y="154" width="46" height="46" rx="10" ry="10" fill="#2163A7" stroke="none"/>
  <text x="83" y="185" font-family="'Hiragino Kaku Gothic ProN W6','Hiragino Sans W6',sans-serif" font-size="16" fill="#FFFFFF" text-anchor="middle" font-weight="normal">2</text>
  <text x="128" y="184" font-family="'Hiragino Kaku Gothic ProN','Hiragino Sans',sans-serif" font-size="15" fill="#3E4148" text-anchor="start" font-weight="normal">Server Components をサーバーで実行する</text>
  <rect x="60" y="216" width="520" height="46" rx="12" ry="12" fill="#F8FAFC" stroke="#90B9DA" stroke-width="2"/>
  <rect x="60" y="216" width="46" height="46" rx="10" ry="10" fill="#2163A7" stroke="none"/>
  <text x="83" y="247" font-family="'Hiragino Kaku Gothic ProN W6','Hiragino Sans W6',sans-serif" font-size="16" fill="#FFFFFF" text-anchor="middle" font-weight="normal">3</text>
  <text x="128" y="246" font-family="'Hiragino Kaku Gothic ProN','Hiragino Sans',sans-serif" font-size="15" fill="#3E4148" text-anchor="start" font-weight="normal">RSC Payload を生成する</text>
  <rect x="60" y="278" width="520" height="46" rx="12" ry="12" fill="#F8FCFF" stroke="#90B9DA" stroke-width="2"/>
  <rect x="60" y="278" width="46" height="46" rx="10" ry="10" fill="#2163A7" stroke="none"/>
  <text x="83" y="309" font-family="'Hiragino Kaku Gothic ProN W6','Hiragino Sans W6',sans-serif" font-size="16" fill="#FFFFFF" text-anchor="middle" font-weight="normal">4</text>
  <text x="128" y="308" font-family="'Hiragino Kaku Gothic ProN','Hiragino Sans',sans-serif" font-size="15" fill="#3E4148" text-anchor="start" font-weight="normal">RSC Payload と Client Components から HTML を生成する</text>
  <rect x="640" y="92" width="520" height="46" rx="12" ry="12" fill="#F8FAFC" stroke="#90B9DA" stroke-width="2"/>
  <rect x="640" y="92" width="46" height="46" rx="10" ry="10" fill="#2163A7" stroke="none"/>
  <text x="663" y="123" font-family="'Hiragino Kaku Gothic ProN W6','Hiragino Sans W6',sans-serif" font-size="16" fill="#FFFFFF" text-anchor="middle" font-weight="normal">5</text>
  <text x="708" y="122" font-family="'Hiragino Kaku Gothic ProN','Hiragino Sans',sans-serif" font-size="15" fill="#3E4148" text-anchor="start" font-weight="normal">HTML をブラウザへ送信する</text>
  <rect x="640" y="154" width="520" height="46" rx="12" ry="12" fill="#F8FCFF" stroke="#90B9DA" stroke-width="2"/>
  <rect x="640" y="154" width="46" height="46" rx="10" ry="10" fill="#2163A7" stroke="none"/>
  <text x="663" y="185" font-family="'Hiragino Kaku Gothic ProN W6','Hiragino Sans W6',sans-serif" font-size="16" fill="#FFFFFF" text-anchor="middle" font-weight="normal">6</text>
  <text x="708" y="184" font-family="'Hiragino Kaku Gothic ProN','Hiragino Sans',sans-serif" font-size="15" fill="#3E4148" text-anchor="start" font-weight="normal">ブラウザが HTML を表示する</text>
  <rect x="640" y="216" width="520" height="46" rx="12" ry="12" fill="#F8FAFC" stroke="#90B9DA" stroke-width="2"/>
  <rect x="640" y="216" width="46" height="46" rx="10" ry="10" fill="#2163A7" stroke="none"/>
  <text x="663" y="247" font-family="'Hiragino Kaku Gothic ProN W6','Hiragino Sans W6',sans-serif" font-size="16" fill="#FFFFFF" text-anchor="middle" font-weight="normal">7</text>
  <text x="708" y="246" font-family="'Hiragino Kaku Gothic ProN','Hiragino Sans',sans-serif" font-size="15" fill="#3E4148" text-anchor="start" font-weight="normal">Client Component 用 JavaScript を読み込む</text>
  <rect x="640" y="278" width="520" height="46" rx="12" ry="12" fill="#F8FCFF" stroke="#90B9DA" stroke-width="2"/>
  <rect x="640" y="278" width="46" height="46" rx="10" ry="10" fill="#2163A7" stroke="none"/>
  <text x="663" y="309" font-family="'Hiragino Kaku Gothic ProN W6','Hiragino Sans W6',sans-serif" font-size="16" fill="#FFFFFF" text-anchor="middle" font-weight="normal">8</text>
  <text x="708" y="308" font-family="'Hiragino Kaku Gothic ProN','Hiragino Sans',sans-serif" font-size="15" fill="#3E4148" text-anchor="start" font-weight="normal">Client Components を Hydration して操作可能にする</text>
  <polyline points="82,324 82,346 640,346 640,92" fill="none" stroke="#CDD6DE" stroke-width="2" stroke-linejoin="round" marker-end="url(#ar)"/>
  <text x="30" y="412" font-family="'Hiragino Kaku Gothic ProN','Hiragino Sans',sans-serif" font-size="13" fill="#52555B" text-anchor="start" font-weight="normal">左列の4ステップが終わってから右列へ進む。Server Component の実装コードはブラウザへ送られない</text>
</svg>
