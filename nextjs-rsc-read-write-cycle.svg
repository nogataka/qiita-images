  <text x="960.0" y="350" font-family="'Hiragino Kaku Gothic ProN','Hiragino Sans','BIZ UDGothic',sans-serif" font-size="13" fill="#5D6B64" text-anchor="middle" font-weight="normal">ユーザー操作を受ける</text>
