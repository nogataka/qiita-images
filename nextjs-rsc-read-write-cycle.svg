  <text x="28" y="462" font-family="'Hiragino Kaku Gothic ProN','Hiragino Sans','BIZ UDGothic',sans-serif" font-size="12" fill="#5D6B64" text-anchor="start" font-weight="normal">上段が読み取り方向、下段が更新方向。更新後は再び上段へ戻り、新しい RSC Payload が画面へ反映される</text>
