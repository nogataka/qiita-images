  <rect width="1200" height="480" fill="#F7F5EF"/>
  <text x="28" y="40" font-family="'Hiragino Kaku Gothic ProN','Hiragino Sans','BIZ UDGothic',sans-serif" font-size="20" fill="#0F4332" text-anchor="start" font-weight="600">RSC と Server Actions が組みになる理由</text>
