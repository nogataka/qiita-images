<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500">
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#2163A7"/>
    </marker>
    <marker id="arR" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#B4472F"/>
    </marker>
  </defs>
  <rect width="1200" height="500" fill="#FFFFFF"/>
  <text x="30" y="46" font-family="'Hiragino Kaku Gothic ProN W6','Hiragino Sans W6',sans-serif" font-size="25" fill="#232A34" text-anchor="start" font-weight="normal">RSC と Server Actions が組みになる理由</text>
  <line x1="30" y1="64" x2="1170" y2="64" stroke="#ECECEC" stroke-width="2" stroke-linecap="round"/>
  <rect x="90" y="110" width="300" height="90" rx="12" ry="12" fill="#F8FCFF" stroke="#90B9DA" stroke-width="2.5"/>
  <text x="240.0" y="140" font-family="'Hiragino Kaku Gothic ProN W6','Hiragino Sans W6',sans-serif" font-size="17" fill="#232A34" text-anchor="middle" font-weight="normal">Database</text>
  <text x="240.0" y="164" font-family="'Hiragino Kaku Gothic ProN','Hiragino Sans',sans-serif" font-size="13.5" fill="#3E4148" text-anchor="middle" font-weight="normal">サーバー状態の正本</text>
  <rect x="450" y="110" width="300" height="90" rx="12" ry="12" fill="#F8FAFC" stroke="#2163A7" stroke-width="2.5"/>
  <text x="600.0" y="140" font-family="'Hiragino Kaku Gothic ProN W6','Hiragino Sans W6',sans-serif" font-size="17" fill="#232A34" text-anchor="middle" font-weight="normal">Server Component</text>
  <text x="600.0" y="164" font-family="'Hiragino Kaku Gothic ProN','Hiragino Sans',sans-serif" font-size="13.5" fill="#3E4148" text-anchor="middle" font-weight="normal">状態を読み取りUIを生成</text>
  <rect x="810" y="110" width="300" height="90" rx="12" ry="12" fill="#F8FCFF" stroke="#90B9DA" stroke-width="2.5"/>
  <text x="960.0" y="140" font-family="'Hiragino Kaku Gothic ProN W6','Hiragino Sans W6',sans-serif" font-size="17" fill="#232A34" text-anchor="middle" font-weight="normal">Browser</text>
  <text x="960.0" y="164" font-family="'Hiragino Kaku Gothic ProN','Hiragino Sans',sans-serif" font-size="13.5" fill="#3E4148" text-anchor="middle" font-weight="normal">RSC Payload を受け取る</text>
  <line x1="396" y1="155" x2="450" y2="155" stroke="#2163A7" stroke-width="3" marker-end="url(#ar)"/>
  <text x="423" y="100" font-family="'Hiragino Kaku Gothic ProN W6','Hiragino Sans W6',sans-serif" font-size="13" fill="#2163A7" text-anchor="middle" font-weight="normal">読み取り</text>
  <line x1="756" y1="155" x2="810" y2="155" stroke="#2163A7" stroke-width="3" marker-end="url(#ar)"/>
  <text x="783" y="100" font-family="'Hiragino Kaku Gothic ProN W6','Hiragino Sans W6',sans-serif" font-size="13" fill="#2163A7" text-anchor="middle" font-weight="normal">RSC Payload</text>
  <rect x="810" y="300" width="300" height="90" rx="12" ry="12" fill="#F8FCFF" stroke="#90B9DA" stroke-width="2.5"/>
  <text x="960.0" y="330" font-family="'Hiragino Kaku Gothic ProN W6','Hiragino Sans W6',sans-serif" font-size="17" fill="#232A34" text-anchor="middle" font-weight="normal">Client Component</text>
  <text x="960.0" y="354" font-family="'Hiragino Kaku Gothic ProN','Hiragino Sans',sans-serif" font-size="13.5" fill="#3E4148" text-anchor="middle" font-weight="normal">ユーザー操作を受ける</text>
  <rect x="450" y="300" width="300" height="90" rx="12" ry="12" fill="#F8FAFC" stroke="#2163A7" stroke-width="2.5"/>
  <text x="600.0" y="330" font-family="'Hiragino Kaku Gothic ProN W6','Hiragino Sans W6',sans-serif" font-size="17" fill="#232A34" text-anchor="middle" font-weight="normal">Server Action</text>
  <text x="600.0" y="354" font-family="'Hiragino Kaku Gothic ProN','Hiragino Sans',sans-serif" font-size="13.5" fill="#3E4148" text-anchor="middle" font-weight="normal">更新をサーバーへ反映</text>
  <rect x="90" y="300" width="300" height="90" rx="12" ry="12" fill="#F8FCFF" stroke="#90B9DA" stroke-width="2.5"/>
  <text x="240.0" y="330" font-family="'Hiragino Kaku Gothic ProN W6','Hiragino Sans W6',sans-serif" font-size="17" fill="#232A34" text-anchor="middle" font-weight="normal">Database</text>
  <text x="240.0" y="354" font-family="'Hiragino Kaku Gothic ProN','Hiragino Sans',sans-serif" font-size="13.5" fill="#3E4148" text-anchor="middle" font-weight="normal">更新後の状態</text>
  <line x1="960" y1="200" x2="960" y2="300" stroke="#2163A7" stroke-width="3" marker-end="url(#ar)"/>
  <line x1="804" y1="345" x2="756" y2="345" stroke="#2163A7" stroke-width="3" marker-end="url(#ar)"/>
  <text x="780" y="418" font-family="'Hiragino Kaku Gothic ProN W6','Hiragino Sans W6',sans-serif" font-size="13" fill="#2163A7" text-anchor="middle" font-weight="normal">ユーザー操作</text>
  <line x1="444" y1="345" x2="396" y2="345" stroke="#2163A7" stroke-width="3" marker-end="url(#ar)"/>
  <text x="420" y="418" font-family="'Hiragino Kaku Gothic ProN W6','Hiragino Sans W6',sans-serif" font-size="13" fill="#2163A7" text-anchor="middle" font-weight="normal">更新</text>
  <polyline points="240,300 240,250 600,250 600,200" fill="none" stroke="#2163A7" stroke-width="3" stroke-linejoin="round" marker-end="url(#ar)"/>
  <text x="420" y="242" font-family="'Hiragino Kaku Gothic ProN','Hiragino Sans',sans-serif" font-size="13" fill="#2163A7" text-anchor="middle" font-weight="normal">再検証して Server Component を再実行する</text>
  <text x="30" y="480" font-family="'Hiragino Kaku Gothic ProN','Hiragino Sans',sans-serif" font-size="13" fill="#52555B" text-anchor="start" font-weight="normal">上段が読み取り方向、下段が更新方向。更新後は再び上段へ戻り、新しい RSC Payload が画面へ反映される</text>
</svg>
